name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-pages-mobile-test-djt7ug
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires Pages to already be enabled (Settings -> Pages -> Source:
      # GitHub Actions). enablement: true does not help here — GITHUB_TOKEN
      # cannot create a Pages site, only a PAT can.
      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
